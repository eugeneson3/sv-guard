# SV-Guard default key mappings.
# Do not edit this file: put your own mappings in keymap.yaml (command "Keymap: Open User Keymap").
# Entries there override these; map a key to null to remove it.
#
# Targets: a command id (see the command palette, Ctrl+Shift+P) or {keys: "..."} to replay vim keys.

leader: "<Space>"
timeoutlen: 1000          # ms to wait when keys could still grow into a longer mapping

normal:                   # editor Normal mode; <leader>, <C-w> and <C-^> entries also work in panels
  "<leader>f": file.find
  "<leader>b": buffer.list
  "<leader>e": view.toggleExplorer
  "<leader>w": file.save
  "<leader><leader>": palette.show
  "<leader>o": file.openRecent
  "<leader>p": problems.show
  "<leader>r": check.run
  "]d": problems.next
  "[d": problems.previous
  "]e": problems.nextError
  "[e": problems.previousError
  "<leader>x": explain.toggle     # Step 5
  "<leader>t": sim.run            # Step 8
  "<leader>s": synth.run          # Step 11
  "gt": tab.next
  "gT": tab.previous
  "<C-^>": buffer.alternate
  "<C-w>h": window.focusLeft
  "<C-w>j": window.focusDown
  "<C-w>k": window.focusUp
  "<C-w>l": window.focusRight
  "<C-w>w": window.focusNext
  "<C-w><C-w>": window.focusNext
  "<C-w>q": file.close

visual: {}

panel: {}                 # extra mappings for panels (file tree, ...)
